[tool.briefcase]
project_name = "Anima"
bundle = "dev.antruc"
version = "1.0.0"
url = "https://github.com/antruc/anima"
license.file = "LICENSE"
author = "Antruc"
author_email = "admin@antruc.dev"

[tool.briefcase.app.anima]
formal_name = "Anima"
description = "Keep only the camera trap photos and videos with an animal or a person"
long_description = """Anima sorts camera trap (trail camera, wildlife camera) photos and videos \
offline. It detects animals and people with MegaDetector v6 and copies only the \
files where one appears to an output folder, leaving empty triggers and false \
positives behind. Originals are never moved or modified."""
icon = "src/anima/resources/icons/anima"
sources = [
    "src/anima",
]
test_sources = [
    "tests",
]

requires = [
    # Upper bounds: a new major version must be tested before it ships.
    # Tested with numpy 2.5, onnxruntime 1.31 and opencv 5.0.
    "numpy>=2,<3",
    "onnxruntime~=1.20",
    "opencv-python-headless>=4.10,<6",
]
test_requires = [
    "pytest",
]

[tool.briefcase.app.anima.linux]
requires = [
    "toga-gtk==0.5.7",  # Pinned: dnd.py uses the private _impl API
    # Minimum version: needs libgirepository-2.0, see beeware/toga#3143
    "pygobject>=3.52.1",
]

[tool.briefcase.app.anima.linux.system.debian]
system_requires = [
    "libcairo2-dev",
    "libgirepository-2.0-dev",
]
system_runtime_requires = [
    "gir1.2-gtk-3.0",
    "libgirepository-2.0-0",
    "libcanberra-gtk3-module",
]

[tool.briefcase.app.anima.linux.system.rhel]
system_requires = [
    "cairo-gobject-devel",
    "gobject-introspection-devel",
]
system_runtime_requires = [
    "gobject-introspection",
    "gtk3",
    "libcanberra-gtk3",
]

[tool.briefcase.app.anima.linux.system.suse]
system_requires = [
    "cairo-devel",
    "gobject-introspection-devel",
]
system_runtime_requires = [
    "gtk3",
    "gobject-introspection", "typelib(Gtk) = 3.0",
    "libcanberra-gtk3-module",
]

[tool.briefcase.app.anima.linux.system.arch]
system_requires = [
    "cairo",
    "gobject-introspection",
    "gtk3",
    "libcanberra",
]
system_runtime_requires = [
    "gtk3",
    "gobject-introspection-runtime",
    "libcanberra",
]

[tool.briefcase.app.anima.linux.appimage]
manylinux = "manylinux_2_28"
system_requires = [
    "cairo-gobject-devel",
    "gobject-introspection-devel",
    "gtk3-devel",
    "libcanberra-gtk3",
    "PackageKit-gtk3-module",
    "gvfs-client",
]
linuxdeploy_plugins = [
    "DEPLOY_GTK_VERSION=3 gtk",
]

[tool.briefcase.app.anima.linux.flatpak]
flatpak_runtime = "org.gnome.Platform"
flatpak_runtime_version = "48"
flatpak_sdk = "org.gnome.Sdk"

[tool.briefcase.app.anima.windows]
requires = [
    "toga-winforms==0.5.7",  # Pinned: dnd.py uses the private _impl API
]
